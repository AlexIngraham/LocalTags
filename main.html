<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Metadata Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Spotify Metadata Editor</h1>
        <div class="form-container">
            <form action="/edit" method="post">
                <input type="file" name="file" placeholder="Select a file">
                <input type="text" name="title" placeholder="Title">
                <input type="text" name="artist" placeholder="Artist">
                <input type="text" name="album" placeholder="Album">
                <input type="text" name="tracknumber" placeholder="Track Number">
                <input type="text" name="genre" placeholder="Genre">
                <input type="file" name="cover" placeholder="Select a cover image">
                <button type="submit">Edit</button>
      </form>
    </div>
  </div>
</body>
<style>
    .container {
        ;root{
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.1);
        }
        .form-container form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .form-container form input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .form-container form button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
</style>



</html>
