<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Local Tags — Spotify Metadata</title>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <p class="eyebrow">local only</p>
        <h1>Local Tags</h1>
        <p class="lede">
          Tag a track, drop cover art, download an MP3 ready for Spotify Local
          Files.
        </p>
      </header>

      <div class="panel">
        <form id="edit-form">
          <div class="field">
            <label for="file">Audio file</label>
            <input
              id="file"
              type="file"
              name="file"
              accept="audio/mpeg,audio/wav,audio/wave,audio/x-wav,audio/flac,audio/aiff,audio/x-aiff,audio/mp4,audio/x-m4a,audio/aac,audio/ogg,audio/vorbis,.mp3,.wav,.flac,.aiff,.aif,.m4a,.aac,.ogg"
              required
            />
            <span class="hint"
              >MP3, WAV, FLAC, AIFF, M4A (ALAC/AAC), AAC, or OGG. Non-MP3 files
              convert to MP3 for Spotify.</span
            >
          </div>

          <div class="divider" aria-hidden="true"></div>

          <div class="field">
            <label for="title">Title</label>
            <input
              id="title"
              type="text"
              name="title"
              placeholder="Song title"
              autocomplete="off"
            />
          </div>

          <div class="field">
            <label for="artist">Artist</label>
            <input
              id="artist"
              type="text"
              name="artist"
              placeholder="Artist name"
              autocomplete="off"
            />
          </div>

          <div class="field">
            <label for="album">Album</label>
            <input
              id="album"
              type="text"
              name="album"
              placeholder="Album name"
              autocomplete="off"
            />
          </div>

          <div class="row">
            <div class="field">
              <label for="track">Track №</label>
              <input
                id="track"
                type="text"
                name="track"
                placeholder="3 or 3/10"
                autocomplete="off"
              />
            </div>
            <div class="field">
              <label for="genre">Genre</label>
              <input
                id="genre"
                type="text"
                name="genre"
                placeholder="Jazz Rock"
                autocomplete="off"
              />
            </div>
          </div>

          <div class="field">
            <label for="cover"
              >Cover art <span class="hint">(optional)</span></label
            >
            <input
              id="cover"
              type="file"
              name="cover"
              accept="image/jpeg,image/png,image/gif,image/webp"
            />
          </div>

          <button type="submit">Write tags</button>
        </form>

        <p class="status" id="status"></p>
        <div
          class="progress"
          id="progress"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-hidden="true"
        >
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-label" id="progress-label">0%</div>
        </div>
        <a class="download-link" id="download-link">Download tagged MP3</a>
      </div>

      <p class="footnote">Nothing uploads. The file never leaves this device.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <script type="module">
      import { ID3Writer } from "https://cdn.jsdelivr.net/npm/browser-id3-writer@6.4.0/+esm";

      const form = document.getElementById("edit-form");
      const statusEl = document.getElementById("status");
      const progressEl = document.getElementById("progress");
      const progressFill = document.getElementById("progress-fill");
      const progressLabel = document.getElementById("progress-label");
      const downloadLink = document.getElementById("download-link");
      const submitBtn = form.querySelector('button[type="submit"]');
      const MP3_BITRATE = 192;

      let downloadUrl = null;
      let audioCtx = null;

      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.classList.remove("ok", "err");
        if (kind) statusEl.classList.add(kind);
      }

      function setProgress(ratio) {
        const pct = Math.max(0, Math.min(100, Math.round(ratio * 100)));
        progressFill.style.width = pct + "%";
        progressLabel.textContent = pct + "%";
        progressEl.setAttribute("aria-valuenow", String(pct));
      }

      function showProgress(show) {
        progressEl.classList.toggle("visible", show);
        progressEl.setAttribute("aria-hidden", show ? "false" : "true");
        if (!show) setProgress(0);
      }

      function safeName(str) {
        return str.replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ").trim();
      }

      function asciiAt(bytes, offset, len) {
        if (offset + len > bytes.length) return "";
        let s = "";
        for (let i = 0; i < len; i++) s += String.fromCharCode(bytes[offset + i]);
        return s;
      }

      function sniffContainer(arrayBuffer) {
        const b = new Uint8Array(arrayBuffer);
        if (b.length < 12) return null;
        if (asciiAt(b, 0, 4) === "RIFF" && asciiAt(b, 8, 4) === "WAVE") return "wav";
        if (asciiAt(b, 0, 4) === "fLaC") return "flac";
        if (asciiAt(b, 0, 4) === "FORM" && (asciiAt(b, 8, 4) === "AIFF" || asciiAt(b, 8, 4) === "AIFC")) {
          return "aiff";
        }
        if (asciiAt(b, 0, 4) === "OggS") return "ogg";
        if (asciiAt(b, 4, 4) === "ftyp") return "m4a";
        if (asciiAt(b, 0, 3) === "ID3") return "mp3";
        if (b[0] === 0xff && (b[1] & 0xe0) === 0xe0) return "mp3";
        return null;
      }

      function bufferHasAscii(bytes, ascii) {
        const needle = new TextEncoder().encode(ascii);
        const limit = Math.min(bytes.length, 512_000) - needle.length;
        outer: for (let i = 0; i <= limit; i++) {
          for (let j = 0; j < needle.length; j++) {
            if (bytes[i + j] !== needle[j]) continue outer;
          }
          return true;
        }
        return false;
      }

      function detectM4aKind(arrayBuffer) {
        const bytes = new Uint8Array(arrayBuffer);
        if (bufferHasAscii(bytes, "alac")) return "alac";
        return "aac";
      }

      function detectFormatFromName(file) {
        const name = file.name.toLowerCase();
        const type = (file.type || "").toLowerCase();

        if (name.endsWith(".mp3") || type === "audio/mpeg") return "mp3";
        if (
          name.endsWith(".wav") ||
          type === "audio/wav" ||
          type === "audio/wave" ||
          type === "audio/x-wav"
        ) {
          return "wav";
        }
        if (name.endsWith(".flac") || type === "audio/flac") return "flac";
        if (
          name.endsWith(".aiff") ||
          name.endsWith(".aif") ||
          type === "audio/aiff" ||
          type === "audio/x-aiff"
        ) {
          return "aiff";
        }
        if (name.endsWith(".aac") || type === "audio/aac") return "aac";
        if (
          name.endsWith(".ogg") ||
          name.endsWith(".oga") ||
          type === "audio/ogg" ||
          type === "audio/vorbis"
        ) {
          return "ogg";
        }
        if (
          name.endsWith(".m4a") ||
          type === "audio/mp4" ||
          type === "audio/x-m4a" ||
          type === "audio/m4a"
        ) {
          return "m4a";
        }
        return null;
      }

      function detectFormat(file, arrayBuffer) {
        const sniffed = sniffContainer(arrayBuffer);
        if (sniffed === "m4a") return detectM4aKind(arrayBuffer);
        if (sniffed) return sniffed;

        const named = detectFormatFromName(file);
        if (named === "m4a") return detectM4aKind(arrayBuffer);
        return named;
      }

      function needsMp3Conversion(format) {
        return format !== "mp3";
      }

      function formatLabel(format) {
        const labels = {
          mp3: "MP3",
          wav: "WAV",
          flac: "FLAC",
          aiff: "AIFF",
          alac: "ALAC",
          aac: "AAC",
          ogg: "OGG",
        };
        return labels[format] || format.toUpperCase();
      }

      function stripId3v1(buffer) {
        const bytes = new Uint8Array(buffer);
        if (
          bytes.length >= 128 &&
          bytes[bytes.length - 128] === 0x54 &&
          bytes[bytes.length - 127] === 0x41 &&
          bytes[bytes.length - 126] === 0x47
        ) {
          return bytes.slice(0, bytes.length - 128).buffer;
        }
        return buffer;
      }

      function coverMime(buffer) {
        const c = new Uint8Array(buffer);
        if (c.length >= 3 && c[0] === 0xff && c[1] === 0xd8 && c[2] === 0xff) {
          return "image/jpeg";
        }
        if (c.length >= 8 && c[0] === 0x89 && c[1] === 0x50 && c[2] === 0x4e && c[3] === 0x47) {
          return "image/png";
        }
        if (c.length >= 6 && c[0] === 0x47 && c[1] === 0x49 && c[2] === 0x46) {
          return "image/gif";
        }
        if (
          c.length >= 12 &&
          c[8] === 0x57 &&
          c[9] === 0x45 &&
          c[10] === 0x42 &&
          c[11] === 0x50
        ) {
          return "image/webp";
        }
        return null;
      }

      function outputName(artist, title, fileName) {
        const a = safeName(artist);
        const t = safeName(title);
        if (a && t) return `${a} - ${t}.mp3`;
        const base = fileName
          .replace(/\.(mp3|wav|flac|aiff|aif|m4a|aac|ogg|oga)$/i, "")
          .trim();
        return (base || "tagged") + " (tagged).mp3";
      }

      function floatTo16BitPCM(float32) {
        const out = new Int16Array(float32.length);
        for (let i = 0; i < float32.length; i++) {
          const s = Math.max(-1, Math.min(1, float32[i]));
          out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        return out;
      }

      function yieldToUi() {
        return new Promise((resolve) => setTimeout(resolve, 0));
      }

      async function convertToMp3(arrayBuffer, format, onProgress) {
        if (!window.lamejs || !window.lamejs.Mp3Encoder) {
          throw new Error(
            "MP3 encoder failed to load. Check your network and refresh.",
          );
        }

        audioCtx =
          audioCtx ||
          new (window.AudioContext || window.webkitAudioContext)();

        let audioBuffer;
        try {
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
        } catch {
          const label = formatLabel(format);
          throw new Error(
            `Could not decode this ${label} file in your browser. Try Chrome/Firefox, or re-export the track and try again.`,
          );
        }

        if (!audioBuffer.sampleRate || audioBuffer.length < 1) {
          throw new Error("That audio file has no samples to convert.");
        }

        const channels = Math.min(2, audioBuffer.numberOfChannels);
        const sampleRate = audioBuffer.sampleRate;
        const left = floatTo16BitPCM(audioBuffer.getChannelData(0));
        const right =
          channels === 2
            ? floatTo16BitPCM(audioBuffer.getChannelData(1))
            : null;

        const encoder = new lamejs.Mp3Encoder(channels, sampleRate, MP3_BITRATE);
        const mp3Chunks = [];
        const blockSize = 1152;
        const total = left.length;

        for (let i = 0; i < total; i += blockSize) {
          const leftChunk = left.subarray(i, i + blockSize);
          let mp3buf;
          if (channels === 2) {
            mp3buf = encoder.encodeBuffer(
              leftChunk,
              right.subarray(i, i + blockSize),
            );
          } else {
            mp3buf = encoder.encodeBuffer(leftChunk);
          }
          if (mp3buf.length > 0) mp3Chunks.push(mp3buf);

          if (i % (blockSize * 40) === 0) {
            if (onProgress) onProgress(Math.min(1, i / total));
            await yieldToUi();
          }
        }

        const end = encoder.flush();
        if (end.length > 0) mp3Chunks.push(end);
        if (onProgress) onProgress(1);

        const totalLength = mp3Chunks.reduce((n, c) => n + c.length, 0);
        if (totalLength < 32) {
          throw new Error("Conversion produced an empty MP3. Try another file.");
        }
        const mp3 = new Uint8Array(totalLength);
        let offset = 0;
        for (const chunk of mp3Chunks) {
          mp3.set(chunk, offset);
          offset += chunk.length;
        }
        return mp3.buffer;
      }

      function writeMp3Tags({
        songBuffer,
        title,
        artist,
        album,
        track,
        genre,
        coverBuffer,
      }) {
        if (!songBuffer || songBuffer.byteLength < 16) {
          throw new Error("That file is empty or too small to be audio.");
        }

        const writer = new ID3Writer(stripId3v1(songBuffer));
        if (title) writer.setFrame("TIT2", title);
        if (artist) writer.setFrame("TPE1", [artist]);
        if (album) writer.setFrame("TALB", album);
        if (track) writer.setFrame("TRCK", track);
        if (genre) writer.setFrame("TCON", [genre]);
        if (coverBuffer) {
          if (!coverMime(coverBuffer)) {
            throw new Error("Cover art must be JPEG, PNG, GIF, or WebP.");
          }
          writer.setFrame("APIC", {
            type: 3,
            data: coverBuffer,
            description: "Cover",
          });
        }
        writer.addTag();
        return writer.getBlob();
      }

      function readForm() {
        return {
          file: form.querySelector("#file").files[0] || null,
          title: form.querySelector("#title").value.trim(),
          artist: form.querySelector("#artist").value.trim(),
          album: form.querySelector("#album").value.trim(),
          track: form.querySelector("#track").value.trim(),
          genre: form.querySelector("#genre").value.trim(),
          cover: form.querySelector("#cover").files[0] || null,
        };
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const { file, title, artist, album, track, genre, cover } = readForm();

        if (!file) {
          setStatus("Choose an audio file first.", "err");
          return;
        }

        if (!title && !artist && !album && !track && !genre && !cover) {
          setStatus("Fill in at least one metadata field.", "err");
          return;
        }

        submitBtn.disabled = true;
        downloadLink.style.display = "none";
        showProgress(false);

        try {
          let songBuffer = await file.arrayBuffer();
          if (songBuffer.byteLength < 16) {
            setStatus("That file is empty or too small to be audio.", "err");
            return;
          }

          const format = detectFormat(file, songBuffer);

          if (!format) {
            setStatus(
              "Unsupported format. Use MP3, WAV, FLAC, AIFF, M4A, AAC, or OGG.",
              "err",
            );
            return;
          }

          if (needsMp3Conversion(format)) {
            const label = formatLabel(format);
            setStatus(`Converting ${label} → MP3`);
            showProgress(true);
            setProgress(0);
            songBuffer = await convertToMp3(songBuffer, format, (p) => {
              setProgress(p);
            });
            showProgress(false);
          }

          setStatus("Writing ID3v2 tags…");
          const coverBuffer = cover ? await cover.arrayBuffer() : null;
          const blob = writeMp3Tags({
            songBuffer,
            title,
            artist,
            album,
            track,
            genre,
            coverBuffer,
          });

          if (downloadUrl) URL.revokeObjectURL(downloadUrl);
          downloadUrl = URL.createObjectURL(blob);

          const outName = outputName(artist, title, file.name);

          downloadLink.href = downloadUrl;
          downloadLink.download = outName;
          downloadLink.textContent = `Download "${outName}"`;
          downloadLink.style.display = "block";

          setStatus(
            needsMp3Conversion(format)
              ? `Done — converted ${formatLabel(format)} to MP3 and tagged (ID3v2.3).`
              : "Done — tags written (ID3v2.3).",
            "ok",
          );
        } catch (err) {
          console.error(err);
          setStatus(err.message || "Could not process file.", "err");
        } finally {
          showProgress(false);
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
