<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Spotify Metadata Editor</title>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f0f0f0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px 16px;
        box-sizing: border-box;
      }
      h1 {
        text-align: center;
        font-size: 24px;
        font-weight: 600;
        color: #333;
        margin: 0 0 10px;
      }
      h2 {
        text-align: center;
        font-size: 16px;
        font-weight: 400;
        color: #4a4a4a;
        margin: 0 0 20px;
      }
      .container {
        background-color: #fff;
        padding: 24px;
        border-radius: 10px;
        box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.1);
        max-width: 420px;
        width: 100%;
        box-sizing: border-box;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: left;
      }
      .field label {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #555;
      }
      .field .hint {
        font-size: 12px;
        color: #888;
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      form input[type="text"],
      form input[type="file"],
      form button {
        padding: 12px;
        border-radius: 9px;
        border: 1.5px solid #cccccc;
        font-family: inherit;
        font-size: 14px;
        box-sizing: border-box;
        width: 100%;
      }
      form input[type="text"]:hover,
      form input[type="text"]:focus,
      form input[type="file"]:hover,
      form input[type="file"]:focus,
      form button:hover,
      form button:focus {
        border: 2px solid #000000;
        outline: none;
      }
      form button {
        margin-top: 4px;
        cursor: pointer;
        background: #fff;
        font-weight: 600;
      }
      form button:active {
        background-color: #000000;
        color: #ffffff;
        border: 2px solid #000000;
      }
      form button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .divider {
        height: 1px;
        background: #ececec;
        margin: 2px 0;
      }
      .status {
        margin-top: 14px;
        font-size: 13px;
        color: #666;
        text-align: center;
        min-height: 1.2em;
      }
      .status.ok {
        color: #2e7d32;
      }
      .status.err {
        color: #c62828;
      }
      .progress {
        display: none;
        margin-top: 10px;
        width: 100%;
      }
      .progress.visible {
        display: block;
      }
      .progress-track {
        width: 100%;
        height: 8px;
        background: #ececec;
        border-radius: 999px;
        overflow: hidden;
        container-type: inline-size;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background-image: linear-gradient(90deg, #e53935 0%, #43a047 100%);
        background-size: 100cqw 100%;
        background-repeat: no-repeat;
        transition: width 0.12s ease-out;
      }
      .progress-label {
        margin-top: 6px;
        font-size: 12px;
        color: #666;
        text-align: center;
      }
      .download-link {
        display: none;
        margin-top: 10px;
        text-align: center;
        font-size: 13px;
        color: #2e7d32;
      }
    </style>
  </head>
  <body>
    <h1>Spotify Metadata Editor</h1>
    <h2>Files all local, does not leave the browser</h2>
    <div class="container">
      <form id="edit-form">
        <div class="field">
          <label for="file">Audio file</label>
          <input
            id="file"
            type="file"
            name="file"
            accept="audio/mpeg,audio/wav,audio/wave,audio/x-wav,audio/flac,audio/aiff,audio/x-aiff,audio/mp4,audio/x-m4a,audio/aac,audio/ogg,audio/vorbis,.mp3,.wav,.flac,.aiff,.aif,.m4a,.aac,.ogg"
            required
          />
          <span class="hint"
            >MP3, WAV, FLAC, AIFF, M4A (ALAC/AAC), AAC, or OGG — non-MP3 files
            convert to MP3 for Spotify</span
          >
        </div>

        <div class="divider" aria-hidden="true"></div>

        <div class="field">
          <label for="title">Title</label>
          <input
            id="title"
            type="text"
            name="title"
            placeholder="Song title"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="artist">Artist</label>
          <input
            id="artist"
            type="text"
            name="artist"
            placeholder="Artist name"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="album">Album</label>
          <input
            id="album"
            type="text"
            name="album"
            placeholder="Album name"
            autocomplete="off"
          />
        </div>

        <div class="row">
          <div class="field">
            <label for="track">Track number</label>
            <input
              id="track"
              type="text"
              name="track"
              placeholder="3 or 3/10"
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="genre">Genre</label>
            <input
              id="genre"
              type="text"
              name="genre"
              placeholder="Jazz Rock"
              autocomplete="off"
            />
          </div>
        </div>

        <div class="field">
          <label for="cover"
            >Cover art <span class="hint">(optional)</span></label
          >
          <input
            id="cover"
            type="file"
            name="cover"
            accept="image/jpeg,image/png"
          />
        </div>

        <button type="submit">Write tags</button>
      </form>
      <p class="status" id="status"></p>
      <div
        class="progress"
        id="progress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-hidden="true"
      >
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label">0%</div>
      </div>
      <a class="download-link" id="download-link">Download tagged MP3</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <script type="module">
      import { ID3Writer } from "https://cdn.jsdelivr.net/npm/browser-id3-writer@6.4.0/+esm";

      const form = document.getElementById("edit-form");
      const statusEl = document.getElementById("status");
      const progressEl = document.getElementById("progress");
      const progressFill = document.getElementById("progress-fill");
      const progressLabel = document.getElementById("progress-label");
      const downloadLink = document.getElementById("download-link");
      const submitBtn = form.querySelector('button[type="submit"]');
      const MP3_BITRATE = 192;

      let downloadUrl = null;
      let audioCtx = null;

      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.classList.remove("ok", "err");
        if (kind) statusEl.classList.add(kind);
      }

      function setProgress(ratio) {
        const pct = Math.max(0, Math.min(100, Math.round(ratio * 100)));
        progressFill.style.width = pct + "%";
        progressLabel.textContent = pct + "%";
        progressEl.setAttribute("aria-valuenow", String(pct));
      }

      function showProgress(show) {
        progressEl.classList.toggle("visible", show);
        progressEl.setAttribute("aria-hidden", show ? "false" : "true");
        if (!show) setProgress(0);
      }

      function safeName(str) {
        return str.replace(/[\\/:*?"<>|]/g, "").trim();
      }

      function bufferHasAscii(bytes, ascii) {
        const needle = new TextEncoder().encode(ascii);
        const limit = Math.min(bytes.length, 2_000_000) - needle.length;
        outer: for (let i = 0; i <= limit; i++) {
          for (let j = 0; j < needle.length; j++) {
            if (bytes[i + j] !== needle[j]) continue outer;
          }
          return true;
        }
        return false;
      }

      /** Distinguish ALAC vs AAC inside .m4a containers. */
      function detectM4aKind(arrayBuffer) {
        const bytes = new Uint8Array(arrayBuffer);
        if (bufferHasAscii(bytes, "alac")) return "alac";
        return "aac";
      }

      function detectFormat(file, arrayBuffer) {
        const name = file.name.toLowerCase();
        const type = (file.type || "").toLowerCase();

        if (name.endsWith(".mp3") || type === "audio/mpeg") return "mp3";

        if (
          name.endsWith(".wav") ||
          type === "audio/wav" ||
          type === "audio/wave" ||
          type === "audio/x-wav"
        ) {
          return "wav";
        }

        if (name.endsWith(".flac") || type === "audio/flac") return "flac";

        if (
          name.endsWith(".aiff") ||
          name.endsWith(".aif") ||
          type === "audio/aiff" ||
          type === "audio/x-aiff"
        ) {
          return "aiff";
        }

        if (name.endsWith(".aac") || type === "audio/aac") return "aac";

        if (
          name.endsWith(".ogg") ||
          name.endsWith(".oga") ||
          type === "audio/ogg" ||
          type === "audio/vorbis"
        ) {
          return "ogg";
        }

        if (
          name.endsWith(".m4a") ||
          type === "audio/mp4" ||
          type === "audio/x-m4a" ||
          type === "audio/m4a"
        ) {
          return detectM4aKind(arrayBuffer);
        }

        return null;
      }

      function needsMp3Conversion(format) {
        return format !== "mp3";
      }

      function formatLabel(format) {
        const labels = {
          mp3: "MP3",
          wav: "WAV",
          flac: "FLAC",
          aiff: "AIFF",
          alac: "ALAC",
          aac: "AAC",
          ogg: "OGG",
        };
        return labels[format] || format.toUpperCase();
      }

      function floatTo16BitPCM(float32) {
        const out = new Int16Array(float32.length);
        for (let i = 0; i < float32.length; i++) {
          const s = Math.max(-1, Math.min(1, float32[i]));
          out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        return out;
      }

      function yieldToUi() {
        return new Promise((resolve) => setTimeout(resolve, 0));
      }

      /**
       * Decode supported audio (WAV/FLAC/AIFF/ALAC/AAC/OGG) via Web Audio,
       * then encode to MP3 (192 kbps) with lamejs.
       */
      async function convertToMp3(arrayBuffer, format, onProgress) {
        if (!window.lamejs || !window.lamejs.Mp3Encoder) {
          throw new Error(
            "MP3 encoder failed to load. Check your network and refresh.",
          );
        }

        audioCtx =
          audioCtx ||
          new (window.AudioContext || window.webkitAudioContext)();

        let audioBuffer;
        try {
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
        } catch {
          const label = formatLabel(format);
          throw new Error(
            `Could not decode this ${label} file in your browser. Try Chrome/Firefox, or re-export the track and try again.`,
          );
        }

        const channels = Math.min(2, audioBuffer.numberOfChannels);
        const sampleRate = audioBuffer.sampleRate;
        const left = floatTo16BitPCM(audioBuffer.getChannelData(0));
        const right =
          channels === 2
            ? floatTo16BitPCM(audioBuffer.getChannelData(1))
            : null;

        const encoder = new lamejs.Mp3Encoder(channels, sampleRate, MP3_BITRATE);
        const mp3Chunks = [];
        const blockSize = 1152;
        const total = left.length;

        for (let i = 0; i < total; i += blockSize) {
          const leftChunk = left.subarray(i, i + blockSize);
          let mp3buf;
          if (channels === 2) {
            mp3buf = encoder.encodeBuffer(
              leftChunk,
              right.subarray(i, i + blockSize),
            );
          } else {
            mp3buf = encoder.encodeBuffer(leftChunk);
          }
          if (mp3buf.length > 0) mp3Chunks.push(mp3buf);

          if (i % (blockSize * 40) === 0) {
            if (onProgress) onProgress(Math.min(1, i / total));
            await yieldToUi();
          }
        }

        const end = encoder.flush();
        if (end.length > 0) mp3Chunks.push(end);
        if (onProgress) onProgress(1);

        const totalLength = mp3Chunks.reduce((n, c) => n + c.length, 0);
        const mp3 = new Uint8Array(totalLength);
        let offset = 0;
        for (const chunk of mp3Chunks) {
          mp3.set(chunk, offset);
          offset += chunk.length;
        }
        return mp3.buffer;
      }

      function writeMp3Tags({
        songBuffer,
        title,
        artist,
        album,
        track,
        genre,
        coverBuffer,
      }) {
        const writer = new ID3Writer(songBuffer);
        if (title) writer.setFrame("TIT2", title);
        if (artist) writer.setFrame("TPE1", [artist]);
        if (album) writer.setFrame("TALB", album);
        if (track) writer.setFrame("TRCK", track);
        if (genre) writer.setFrame("TCON", [genre]);
        if (coverBuffer) {
          writer.setFrame("APIC", {
            type: 3,
            data: coverBuffer,
            description: "Cover",
          });
        }
        writer.addTag();
        return writer.getBlob();
      }

      function readForm() {
        return {
          file: form.querySelector("#file").files[0] || null,
          title: form.querySelector("#title").value.trim(),
          artist: form.querySelector("#artist").value.trim(),
          album: form.querySelector("#album").value.trim(),
          track: form.querySelector("#track").value.trim(),
          genre: form.querySelector("#genre").value.trim(),
          cover: form.querySelector("#cover").files[0] || null,
        };
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const { file, title, artist, album, track, genre, cover } = readForm();

        if (!file) {
          setStatus("Choose an audio file first.", "err");
          return;
        }

        if (!title && !artist && !album && !track && !genre && !cover) {
          setStatus("Fill in at least one metadata field.", "err");
          return;
        }

        submitBtn.disabled = true;
        downloadLink.style.display = "none";
        showProgress(false);

        try {
          let songBuffer = await file.arrayBuffer();
          const format = detectFormat(file, songBuffer);

          if (!format) {
            setStatus(
              "Unsupported format. Use MP3, WAV, FLAC, AIFF, M4A, AAC, or OGG.",
              "err",
            );
            return;
          }

          if (needsMp3Conversion(format)) {
            const label = formatLabel(format);
            setStatus(`Converting ${label} → MP3`);
            showProgress(true);
            setProgress(0);
            songBuffer = await convertToMp3(songBuffer, format, (p) => {
              setProgress(p);
            });
            showProgress(false);
          }

          setStatus("Writing ID3v2 tags…");
          const coverBuffer = cover ? await cover.arrayBuffer() : null;
          const blob = writeMp3Tags({
            songBuffer,
            title,
            artist,
            album,
            track,
            genre,
            coverBuffer,
          });

          if (downloadUrl) URL.revokeObjectURL(downloadUrl);
          downloadUrl = URL.createObjectURL(blob);

          const outName =
            artist && title
              ? `${safeName(artist)} - ${safeName(title)}.mp3`
              : file.name.replace(
                  /\.(mp3|wav|flac|aiff|aif|m4a|aac|ogg|oga)$/i,
                  "",
                ) + " (tagged).mp3";

          downloadLink.href = downloadUrl;
          downloadLink.download = outName;
          downloadLink.textContent = `Download "${outName}"`;
          downloadLink.style.display = "block";

          setStatus(
            needsMp3Conversion(format)
              ? `Done — converted ${formatLabel(format)} to MP3 and tagged (ID3v2.3).`
              : "Done — tags written (ID3v2.3).",
            "ok",
          );
        } catch (err) {
          console.error(err);
          setStatus(err.message || "Could not process file.", "err");
        } finally {
          showProgress(false);
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
